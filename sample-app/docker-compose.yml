# Your app, kept running after reboots, reachable by Nginx on port 3000.
services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "127.0.0.1:3000:3000"

  # Need a database? Uncomment this, and set DATABASE_URL in .env to
  # postgres://app:change-me@db:5432/app
